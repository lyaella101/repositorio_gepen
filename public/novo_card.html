<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Nova recomendação</title>
  </head>
  <body>
    <a href="/admin.html">Voltar</a>
    <h1>Nova recomendação</h1>
    <p>* campos obrigatórios</p>

    <form id="formulario_card">
      <label>
        Título *
        <input type="text" name="titulo" required maxlength="200" />
      </label>

      <label>
        Descrição *
        <textarea name="descricao" required></textarea>
      </label>

      <label>
        Link do material
        <input
          type="url"
          name="url"
          required
          maxlength="2048"
          pattern="https?://.+"
        />
      </label>

      <label>
        Tipo *
        <select name="tipoId" id="campo_tipo" required>
          <option value="">Selecione</option>
        </select>
      </label>

      <label>
        Categoria *
        <select name="categoriaId" id="campo_categoria" required>
          <option value="">Selecione</option>
        </select>
      </label>

      <fieldset>
        <legend>Tags * (1 a 5)</legend>
        <div id="lista_tags">Escolha uma categoria para ver as tags.</div>
      </fieldset>

      <label>
        Nível de Aprendizado *
        <select name="nivelId" id="campo_nivel" required>
          <option value="">Selecione</option>
        </select>
      </label>

      <label>
        Idioma do material *
        <select name="idioma" required>
          <option value="">Selecione</option>
          <option>Japonês</option>
          <option>Português</option>
          <option>Inglês</option>
          <option>Outro</option>
        </select>
      </label>

      <label>
        Observações do professor (Opcional)
        <textarea name="observacoes"></textarea>
      </label>

      <button type="submit">Salvar recomendações</button>

      <p id="mensagem" aria-live="polite"></p>

      <script src="/novo_card.js"></script>
    </form>
  </body>
</html>
