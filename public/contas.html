<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Gerenciar contas</title>
    <link rel="stylesheet" href="/css/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#a3262c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/img/app/icone-192.png" />
    <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png" />
    <script src="/js/pwa.js" defer></script>
  </head>
  <body>
    <header class="cabecalho">
      <a class="cabecalho-marca" href="/">
        <span class="cabecalho-logo" aria-hidden="true"></span>
        Repositório GEPEN
      </a>
      <nav class="cabecalho-acoes" aria-label="Conta">
        <a href="/senha.html">Alterar senha</a>
        <form method="POST" action="/logout">
          <button type="submit">Sair</button>
        </form>
      </nav>
    </header>
    <a href="/admin.html">Voltar ao painel</a>
    <h1>Gerenciar contas</h1>

    <p id="mensagem" aria-live="polite">Carregando...</p>

    <section id="area_contas" hidden>
      <h2>Nova conta</h2>
      <form id="formulario_conta">
        <label
          >Nome *
          <input type="text" name="nome" required maxlength="100" />
        </label>

        <label
          >E-mail *
          <input type="email" name="email" required maxlength="255" />
        </label>

        <label
          >Papel *
          <select name="papel" required>
            <option value="bolsista">Bolsista</option>
            <option value="professor">Professor</option>
          </select>
        </label>

        <button type="submit">Criar conta</button>
      </form>

      <div id="senha_criada" hidden>
        <p>
          <strong>Senha provisória de <span id="senha_nome"></span>:</strong>
          <code id="senha_valor"></code>
        </p>
        <p>
          Anote e entregue por um canal seguro. Ela não será mostrada de novo.
        </p>
      </div>

      <h2>Contas</h2>
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Papel</th>
            <th>Situação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela_contas"></tbody>
      </table>
    </section>

    <script src="/js/contas.js"></script>
  </body>
</html>
