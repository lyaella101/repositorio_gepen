<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Area Administrativa</title>
  </head>
  <body>
    <p id="aviso_sessao"></p>

    <main id="conteudo" hidden>
      <h1>Area Administrativa</h1>
      <p>Olá, <span id="nome_usuario"></span></p>

      <a href="/senha.html">Alterar senha</a>
      <a href="/contas.html" id="link_contas" hidden>Gerenciar Contas</a>
      <a href="/">Ir para o catálogo</a>

      <form method="POST" action="/logout">
        <button type="submit">Logout</button>
      </form>

      <h1>Painel Administrativo</h1>
      <p>Gerencie as recomendações deste Repositório</p>

      <a href="/novo_card.html">Criar recomendação</a>

      <p id="mensagem" aria-live="polite"></p>

      <form id="filtros">
        <label
          >Buscar pelo título ou descrição
          <input type="search" id="busca" placeholder="Ex.: kanji" />
        </label>

        <label
          >Tipo
          <select id="filtro_tipo">
            <option value="">Todos</option>
          </select>
        </label>

        <label
          >Categoria
          <select id="filtro_categoria">
            <option value="">Todas</option>
          </select>
        </label>

        <label
          >Nível
          <select id="filtro_nivel">
            <option value="">Todos</option>
          </select>
        </label>

        <label
          >Idioma
          <select id="filtro_idioma">
            <option value="">Todos</option>
            <option value="Japonês">Japonês</option>
            <option value="Português">Português</option>
            <option value="Inglês">Inglês</option>
            <option value="Outro">Outro</option>
          </select>
        </label>

        <button type="button" id="limpar_filtros">Limpar</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Recomendação</th>
            <th>Classificação</th>
            <th>Tags</th>
            <th>Publicada em</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela_cards">
          <tr>
            <td colspan="4">Carregando...</td>
          </tr>
        </tbody>
      </table>
    </main>

    <script src="/admin.js"></script>
  </body>
</html>
