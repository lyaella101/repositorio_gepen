<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Editar recomendação</title>
    <link rel="stylesheet" href="/css/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#a3262c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/img/app/icone-192.png" />
    <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png" />
    <script src="/js/pwa.js" defer></script>
  </head>
  <body>
    <header class="cabecalho">
      <a class="cabecalho-marca" href="/">
        <span class="cabecalho-logo" aria-hidden="true"></span>
        Repositório GEPEN
      </a>
      <nav class="cabecalho-acoes" aria-label="Conta">
        <a href="/senha.html">Alterar senha</a>
        <form method="POST" action="/logout">
          <button type="submit">Sair</button>
        </form>
      </nav>
    </header>
    <a href="/admin.html">Voltar</a>
    <h1>Editar recomendação</h1>

    <form id="formulario_card" hidden>
      <p>* campos obrigatórios</p>
      <label>
        Título *
        <input type="text" name="titulo" required maxlength="200" />
      </label>

      <label>
        Descrição *
        <textarea name="descricao" required></textarea>
      </label>

      <label>
        Link do material
        <input
          type="url"
          name="url"
          required
          maxlength="2048"
          pattern="https?://.+"
        />
      </label>

      <label>
        Tipo *
        <select name="tipoId" id="campo_tipo" required>
          <option value="">Selecione</option>
        </select>
      </label>

      <label>
        Categoria *
        <select name="categoriaId" id="campo_categoria" required>
          <option value="">Selecione</option>
        </select>
      </label>

      <fieldset>
        <legend>Tags * (1 a 5)</legend>
        <div id="lista_tags">Escolha uma categoria para ver as tags.</div>
      </fieldset>

      <label>
        Nível de Aprendizado *
        <select name="nivelId" id="campo_nivel" required>
          <option value="">Selecione</option>
        </select>
      </label>

      <label>
        Idioma do material *
        <select name="idioma" required>
          <option value="">Selecione</option>
          <option>Japonês</option>
          <option>Português</option>
          <option>Inglês</option>
          <option>Outro</option>
        </select>
      </label>

      <label>
        Observações do professor (Opcional)
        <textarea name="observacoes"></textarea>
      </label>

      <button type="submit">Salvar recomendações</button>
    </form>

    <p id="mensagem" aria-live="polite"></p>

    <script src="/js/editar_card.js"></script>
  </body>
</html>
