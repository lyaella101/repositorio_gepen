<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Alterar Senha</title>
    <link rel="stylesheet" href="/css/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#a3262c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/img/app/icone-192.png" />
    <link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png" />
    <script src="/js/pwa.js" defer></script>
  </head>
  <body>
    <header class="cabecalho">
      <a class="cabecalho-marca" href="/">
        <span class="cabecalho-logo" aria-hidden="true"></span>
        Repositório GEPEN
      </a>
      <nav class="cabecalho-acoes" aria-label="Conta">
        <a href="/senha.html">Alterar senha</a>
        <form method="POST" action="/logout">
          <button type="submit">Sair</button>
        </form>
      </nav>
    </header>
    <form id="formulario_senha">
      <label>
        Senha Atual:
        <input type="password" name="senhaAtual" required />
      </label>
      <label>
        Nova Senha:
        <input
          type="password"
          name="novaSenha"
          required
          minlength="8"
          maxlength="64"
        />
      </label>
      <label>
        Confirmar Nova Senha:
        <input type="password" name="confirmarNovaSenha" required />
      </label>
      <button type="submit">Salvar nova senha</button>
    </form>
    <p id="error_message" aria-live="polite"></p>

    <a href="/admin.html">Voltar para o perfil</a>

    <script src="/js/senha.js"></script>
  </body>
</html>
>
