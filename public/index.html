<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Repositório de recomendações da GEPEN</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="cabecalho">
      <a class="cabecalho-marca" href="/">
        <span class="cabecalho-logo" aria-hidden="true"></span>
        Repositório GEPEN
      </a>
      <nav class="cabecalho-acoes" aria-label="Conta">
        <a href="/login.html">Entrar</a>
      </nav>
    </header>
    <h1>Repositório de recomendações</h1>
    <p>Materiais de língua e cultura japonesa indicados pela GEPEN</p>

    <label>
      Buscar por título ou descrição
      <input type="search" id="busca" placeholder="Partículas" />
    </label>

    <p id="contagem"></p>

    <form id="filtros">
      <h2>Filtros</h2>

      <label
        >Tipo de material
        <select name="tipoId" id="filtro_tipo">
          <option value="">Todos</option>
        </select>
      </label>

      <label
        >Categoria
        <select name="categoriaId" id="filtro_categoria">
          <option value="">Todas</option>
        </select>
      </label>

      <fieldset>
        <legend>Tags</legend>
        <div id="filtro_tags">Escolha uma categoria para ver as tags dela.</div>
      </fieldset>

      <label
        >Nível de aprendizado
        <select name="nivelId" id="filtro_nivel">
          <option value="">Todos</option>
        </select>
      </label>

      <label
        >Idioma do material
        <select name="idioma">
          <option value="">Todos</option>
          <option>Japonês</option>
          <option>Português</option>
          <option>Inglês</option>
          <option>Outro</option>
        </select>
      </label>

      <button type="button" id="limpar_filtros">Limpar filtros</button>
    </form>

    <div id="lista_cards">Carregando...</div>

    <dialog id="detalhes">
      <button type="button" id="fechar_detalhes" aria-label="Fechar">✕</button>

      <h2 id="detalhes_titulo"></h2>
      <p id="detalhes_classificacao"></p>
      <p id="detalhes_tags"></p>

      <h3>Descrição</h3>
      <p id="detalhes_descricao"></p>

      <div id="detalhes_area_observacoes">
        <h3>Observações do professor</h3>
        <p id="detalhes_observacoes"></p>
      </div>

      <p id="detalhes_idioma"></p>
      <p id="detalhes_data"></p>

      <a id="detalhes_link" target="_blank" rel="noopener noreferrer"
        >Abrir material</a
      >
    </dialog>

    <footer>
      <a href="/admin.html">Acesso da equipe</a>
    </footer>

    <script src="/js/catalogo.js"></script>
  </body>
</html>
